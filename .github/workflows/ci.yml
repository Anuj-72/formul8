name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The job only reads the repository, so the token needs nothing beyond that.
permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The version comes from the go directive in go.mod, so CI can never
      # disagree with the minimum the module actually declares.
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # gofmt -l prints offenders and exits 0, which would pass silently, so
      # the emptiness of its output is the assertion.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt wants these files reformatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
